<script>
/*
 * Contact — page script (GoHighLevel-ready)
 * Paste wrapped in a script tag in this page's Settings → Tracking Code → Footer (or a Custom Code
 * element at the bottom of the page). Requires the site-wide scripts; load order does not matter.
 * The form itself is the native GHL form rendered by oc-site.js ("embed-form").
 */
(window.OC_QUEUE = window.OC_QUEUE || []).push(function (oc) {
  var esc = oc.esc;
  oc.register("contact-branches", function (el) {
    el.innerHTML = oc
      .list("branches")
      .map(function (b) {
        var hours = oc.groupedHours(b.hours)
          .map(function (g) {
            return esc(g.days + " " + g.time);
          })
          .join(" · ");
        return (
          '<div class="oc-contact-branch"><h2 class="oc-contact-branch__name">' + esc(b.name) + "</h2>" +
          '<p class="oc-contact-branch__line">' + oc.icon("pin") + "<span>" + esc((b.address || []).join(", ")) + (b.mapUrl ? ' · <a class="oc-text-link" href="' + esc(b.mapUrl) + '" target="_blank" rel="noopener">Map<span class="oc-sr-only"> (opens in a new tab)</span></a>' : "") + "</span></p>" +
          (b.phone ? '<p class="oc-contact-branch__line">' + oc.icon("phone") + '<a href="' + esc(oc.telHref(b.phone)) + '">' + esc(b.phone) + "</a></p>" : "") +
          '<p class="oc-contact-branch__line">' + oc.icon("clock") + "<span>" + hours + "</span></p>" +
          "</div>"
        );
      })
      .join("");
  });
});
</script>
