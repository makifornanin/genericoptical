<!-- FAQ · 02 QUESTIONS — every OC_CONFIG.faqs item as a native <details> accordion (first one
     open) + FAQPage structured data for search engines (faq.js). Edit the questions in the config
     so the home-page preview and this page stay in sync. -->
<section class="oc">
  <div class="oc-container oc-faq">
    <div class="oc-faq__list" data-oc-render="faq-list"></div>
    <aside class="oc-aside-card" aria-labelledby="oc-faq-aside-title">
      <h2 class="oc-aside-card__title" id="oc-faq-aside-title">Still have a question?</h2>
      <p class="oc-aside-card__body">Send us a message and we'll get back to you, <span data-oc-text="business.replyTime">usually within one business day</span>.</p>
      <a class="oc-btn oc-btn--brand" href="/contact" data-oc-href="links.contact">Contact us</a>
    </aside>
  </div>
</section>
