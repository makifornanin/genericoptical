<!-- HOME · 07 BOOKING CTA + FAQ PREVIEW — the first four OC_CONFIG.faqs (rendered by home.js);
     native <details> accordions, no script needed to open them. -->
<section class="oc">
  <div class="oc-container oc-section oc-section--tight-top">
    <div class="oc-cta">
      <div class="oc-cta__main">
        <p class="oc-eyebrow oc-eyebrow--inherit">Ready when you are</p>
        <h2 class="oc-cta__title">Book your next eye exam online.</h2>
        <p class="oc-cta__body">Pick a branch, a service and a time that suits you. We'll confirm by phone or email.</p>
        <div class="oc-cta__actions">
          <a class="oc-btn oc-btn--accent oc-btn--lg" href="/book" data-oc-href="links.booking">Book an appointment
            <svg class="oc-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
          <a class="oc-btn oc-btn--light oc-btn--lg" href="/contact" data-oc-href="links.contact">Ask a question</a>
        </div>
      </div>
      <div class="oc-cta__faq">
        <p class="oc-eyebrow oc-eyebrow--inherit">Common questions</p>
        <div class="oc-faq-mini" data-oc-render="faq-mini"></div>
        <a class="oc-arrow-link" href="/faq" data-oc-href="links.faq">All questions
          <svg class="oc-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
      </div>
    </div>
  </div>
</section>
