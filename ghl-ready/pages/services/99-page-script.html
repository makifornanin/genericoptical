<!--
  PAGE SCRIPT for Services.
  WHERE: A Custom Code element in the last section before the footer (or this page's Footer tracking code).
  Generated by tools/build-ghl.mjs from the source files — edit the sources, then re-run it.
-->
<script>
/*
 * Services — page script (GoHighLevel-ready)
 * Paste wrapped in a script tag in this page's Settings → Tracking Code → Footer (or a Custom Code
 * element at the bottom of the page). Requires the site-wide scripts; load order does not matter.
 */
(window.OC_QUEUE = window.OC_QUEUE || []).push(function (oc) {
  var esc = oc.esc;
  function enabled() {
    return oc.list("services").filter(function (s) {
      return s && s.enabled !== false;
    });
  }
  function price(s) {
    return typeof s.price === "number" ? oc.money(s.price) : s.priceLabel || "Price on request";
  }

  oc.register("service-cards", function (el) {
    var cards = enabled().filter(function (s) {
      return s.bookable;
    });
    el.hidden = !cards.length;
    el.querySelector("[data-oc-cards]").innerHTML = cards
      .map(function (s) {
        var href = oc.link(oc.val("links.booking", "/book") + "?service=" + encodeURIComponent(s.id));
        return (
          '<li class="oc-svc-card">' +
          '<div class="oc-svc-card__top"><h3 class="oc-svc-card__title">' + esc(s.name) + '</h3><p class="oc-svc-card__price">' + esc(price(s)) + "</p></div>" +
          '<p class="oc-svc-card__meta">' + (s.duration ? "<span>" + oc.icon("clock", "oc-icon--sm") + esc(s.duration + " minutes") + "</span>" : "") + "<span>" + oc.icon("calendar", "oc-icon--sm") + "Book online</span></p>" +
          '<p class="oc-svc-card__desc">' + esc(s.description) + "</p>" +
          '<div class="oc-svc-card__action"><a class="oc-btn oc-btn--brand" href="' + esc(href) + '">Book this<span class="oc-sr-only"> — ' + esc(s.name) + "</span>" + oc.icon("up") + "</a></div>" +
          "</li>"
        );
      })
      .join("");
  });

  oc.register("service-list", function (el) {
    var items = enabled().filter(function (s) {
      return !s.bookable;
    });
    el.hidden = !items.length;
    el.querySelector("[data-oc-list]").innerHTML = items
      .map(function (s) {
        return (
          '<li><div><h3 class="oc-price-list__name">' + esc(s.name) + '</h3><p class="oc-price-list__desc">' + esc(s.description) + "</p></div>" +
          '<p class="oc-price-list__price">' + esc(price(s)) + "</p></li>"
        );
      })
      .join("");
  });
});
</script>
