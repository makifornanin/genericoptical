  GLOBAL HEADER — promo banner, brand, navigation, "Book an exam", mobile menu.
  GHL: put this in ONE Custom Code element inside a GLOBAL SECTION at the top of every page
  (Section: full width, padding 0; Row/Column: full width, padding 0). See components/README.md.
  Content comes from OC_CONFIG (business, nav, headerCta, promo); the text below is the fallback

<div class="oc oc-header-wrap" data-oc-render="header">

        </span>
      </a>
      <nav class="oc-nav" aria-label="Main" data-oc-nav>
        <a href="/eyewear">Eyewear</a>

        <a href="/about">About</a>

        <li><a href="/eyewear">Eyewear</a></li>
        <li><a href="/services">Services</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/faq">FAQ</a></li>
        <li><a href="/contact">Contact</a></li>

      <a class="oc-btn oc-btn--brand oc-btn--lg" href="/book" data-oc-cta>Book an exam</a>
