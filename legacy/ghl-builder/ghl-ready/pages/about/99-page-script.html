<script>

(window.OC_QUEUE = window.OC_QUEUE || []).push(function (oc) {
  oc.register("branch-strip", function (el) {
    var branches = oc.list("branches");
    el.hidden = !branches.length;
    el.innerHTML = branches
      .map(function (b) {
        return (
          '<li><h3 class="oc-branch-strip__name">' + oc.esc(b.name) + "</h3>" +
          '<p class="oc-branch-strip__address">' + oc.esc((b.address || []).join(", ")) + "</p>" +
          (b.phone ? '<p class="oc-branch-strip__address"><a href="' + oc.esc(oc.telHref(b.phone)) + '">' + oc.esc(b.phone) + "</a></p>" : "") +
          '<ul class="oc-branch-strip__hours">' + oc.hoursRows(b.hours) + "</ul></li>"
        );
      })
      .join("");
  });
});
</script>
