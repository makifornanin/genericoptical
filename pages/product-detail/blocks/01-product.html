<!-- PRODUCT · 01 PRODUCT DETAIL — one GHL page shows every product: /eyewear-item?p=<product-id>.
     Rendered by product-detail.js from scripts/oc-catalogue.js: images, description, variants,
     price, availability note, "Ask about this" (native GHL form, prefilled with the product and the
     chosen variant), a booking button and, when the product has a storeUrl, "Buy online" (native
     GHL store with live stock). The text below shows until the script runs. -->
<section class="oc" id="oc-main" tabindex="-1" data-oc-render="product">
  <div class="oc-container oc-product">
    <a class="oc-back" href="/eyewear" data-oc-href="links.eyewear">
      <svg class="oc-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>All eyewear</a>
    <div data-oc-product-body>
      <p class="oc-catalogue__note">Loading product…</p>
    </div>
  </div>
</section>
