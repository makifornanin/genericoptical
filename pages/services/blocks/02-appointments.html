<!-- SERVICES · 02 APPOINTMENTS — one card per enabled service with bookable:true in
     OC_CONFIG.services (services.js). "Book this" opens the booking page with that service chosen. -->
<section class="oc" data-oc-render="service-cards">
  <div class="oc-container oc-section">
    <div class="oc-section-head">
      <p class="oc-eyebrow"><span class="oc-eyebrow__index">01</span>Book online</p>
      <div class="oc-section-head__text">
        <h2 class="oc-section-head__title">Appointments</h2>
        <p class="oc-section-head__body">Bookable online at any branch. Each slot is reserved for you and an optometrist or optician.</p>
      </div>
    </div>
    <ul class="oc-svc-cards" data-oc-cards></ul>
  </div>
</section>
